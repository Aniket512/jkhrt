# Optional one-click backend deploy on Render (https://render.com)
services:
  - type: web
    name: jkhrt-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ELEXON_TIMEOUT_SECONDS
        value: "90"
